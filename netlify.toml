# Install from the workspace root so Netlify finds pnpm-lock.yaml.
# Set the site's Package directory to "yoh-app-academy" in Netlify.
[build]
  command = "pnpm --dir yoh-app-academy build"
  publish = "yoh-app-academy/.next"

[build.environment]
  NODE_VERSION = "24"
  PNPM_FLAGS = "--shamefully-hoist"

[functions]
  included_files = ["yoh-app-academy/public/fonts/*-certificate.ttf"]

[[plugins]]
  package = "@netlify/plugin-nextjs"
