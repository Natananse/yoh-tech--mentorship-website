<!doctype html><html lang="en"><head><meta charset="utf-8"><title>YO Tech original project screens</title><style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap');*{box-sizing:border-box}body{margin:0;font:12px 'DM Sans',sans-serif;color:#28342b}.artboard{width:640px;height:360px;position:relative;overflow:hidden;background:#e5f1f9}.label{position:absolute;left:30px;top:28px;font-size:9px;letter-spacing:2px}.caption{position:absolute;left:30px;bottom:33px;width:210px}.caption h1{font:800 31px/1.1 Manrope,sans-serif;letter-spacing:-1.2px;margin:10px 0}.caption p{font-size:10px;line-height:1.8}.phone{position:absolute;background:#fffdf9;border:4px solid #343c35;border-radius:25px;width:184px;height:355px;overflow:hidden;box-shadow:8px 16px 20px #37462a16}.status{display:flex;justify-content:space-between;font-size:7px;padding:9px 13px}.inner{padding:14px}.inner small{font-size:6px;letter-spacing:1px;color:#7c876d}.inner h2{font:800 23px/1.1 Manrope,sans-serif;letter-spacing:-1px;margin:8px 0 16px}.inner h3{font-size:13px;margin:8px 0}.days{display:flex;justify-content:space-between;margin:13px 0;font-size:8px}.days b{background:#dde6cb;padding:8px;border-radius:7px}.card{background:#f2e5cd;padding:14px;border-radius:12px;margin:12px 0;font-size:9px;line-height:1.6}.line{padding:10px 0;border-bottom:1px solid #e5e9df;font-size:8px;display:flex;justify-content:space-between}.check{color:#799260}.bottom{position:absolute;bottom:11px;left:12px;right:12px;display:flex;justify-content:space-around;background:#fffef9;border-top:1px solid #edf0e5;padding:9px;color:#9ba38a;font-size:9px}.photo{height:105px;border-radius:10px;background:linear-gradient(155deg,#c6d9e2 40%,#8aa78e 41%,#aec19d 62%,#d1d8b1 63%);position:relative;margin:12px 0}.photo::after{content:'LAKE TANA / 06:12';position:absolute;bottom:10px;left:10px;font-size:6px;background:#fff9;padding:4px}.photo.two{background:linear-gradient(120deg,#ead2a9 30%,#bb9b75 31%,#d7bc90 56%,#8a9a78 57%);height:77px}.orange{background:#c74717;color:white;border:0;border-radius:7px;padding:10px;width:100%;font:inherit;font-size:8px}.habit{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin:13px 0}.habit i{height:13px;background:#e7ebdd;border-radius:3px}.habit i:nth-child(3n){background:#afc398}.ring{width:90px;height:90px;border:10px solid #e6ebd9;border-top-color:#c74717;border-right-color:#c74717;border-bottom-color:#c74717;border-radius:50%;display:grid;place-items:center;margin:14px auto;font:800 22px Manrope}.recipe{height:110px;background:radial-gradient(ellipse,#b17d4a 10%,#d8b16f 11%,#d8b16f 30%,#93a271 31%,#72865b 38%,#e8d5b3 39%,#f7ebd5 45%,#e6d6bc 46%);border-radius:50%;margin:15px}.tag{padding:5px 8px;background:#f6ece1;border-radius:20px;font-size:6px}.note{border-radius:9px;padding:12px;background:#e6efd9;font-size:8px;line-height:1.8;margin:10px 0}.note:nth-child(2n){background:#f8ebda}.build{display:flex;justify-content:space-between;padding:12px;background:#f2f4ee;border-radius:7px;margin:10px 0;font-size:8px}.feature{position:absolute;background:#fffdf9;border:1px solid #fff;border-radius:13px;padding:18px;box-shadow:0 8px 24px #202b1810;font-size:9px}.feature b{display:block;font-size:19px;margin:8px 0}.code{background:#29332c;color:#c6d4ba;font:9px/2 monospace;padding:19px;border-radius:9px;position:absolute;width:220px;bottom:30px;left:30px}.art0 .phone{right:45px;top:30px;transform:rotate(9deg)}.art0 .feature{top:51px;left:72px;transform:rotate(-5deg)}.art0 .caption{bottom:32px}.art1{background:#fbe9de}.art1 .phone:nth-of-type(1){right:220px;top:44px;transform:rotate(-8deg)}.art1 .phone:nth-of-type(2){right:28px;top:-20px;transform:rotate(8deg)}.art1 .caption{left:23px;bottom:18px;width:180px}.art1 .caption h1{font-size:26px}.art2{background:#f7efc8}.art2 .phone{right:55px;top:-12px;transform:rotate(-5deg)}.art2 .caption{top:32px}.art3{background:#f7e8e9}.art3 .phone{right:200px;top:33px;transform:rotate(-13deg)}.art3 .phone.detail{right:22px;top:120px;transform:rotate(7deg)}.art3 .caption{left:30px;top:26px;width:150px}.art4{background:#e5efe7}.art4 .phone{right:65px;top:18px;transform:rotate(4deg)}.art4 .feature{top:60px;left:42px;transform:rotate(-5deg)}.art5{background:#eeebf8}.art5 .phone{left:50px;top:38px;transform:rotate(-7deg)}.art5 .caption{left:auto;right:35px;top:42px;width:230px}.art5 .feature{right:35px;bottom:35px;width:225px}.art5 .feature b{font-size:14px}
</style></head><body><div id="root"></div><script>
const shell=(body,cls='')=>`<div class="phone ${cls}"><div class="status"><b>9:41</b><span>● ▰</span></div><div class="inner">${body}</div><div class="bottom">⌂　▦　＋　○</div></div>`;
const planner=shell(`<small>MONDAY / 18 NOV</small><h2>A little more<br>room to breathe.</h2><div class="days"><b>M<br>18</b><b>T<br>19</b><b>W<br>20</b><b>T<br>21</b></div><div class="card"><small>TODAY'S FOCUS</small><h3>Finish the first screen.</h3>2 of 3 tasks complete</div><div class="line"><span>Sketch the layout</span><b class="check">✓</b></div><div class="line"><span>Build a reusable card</span><b class="check">✓</b></div><div class="line"><span>Add a new task</span><b>○</b></div>`);
const journal=shell(`<small>FIELDNOTES</small><h2>Keep the<br>small moments.</h2><div class="photo"></div><h3>A quiet morning</h3><small>BAHIR DAR · 18 NOV</small><div class="photo two"></div>`);
const photoDetail=shell(`<small>ENTRY / 014</small><h2>By the water.</h2><div class="photo" style="height:145px"></div><p style="font-size:8px;line-height:1.8">The lake was still. I took a photo before the town woke up.</p><button class="orange">Save this memory</button>`);
const habits=shell(`<small>STREAK / YOUR WEEK</small><h2>Show up.<br>Then repeat.</h2><div class="ring">75%</div><h3>Read for 20 minutes</h3><div class="habit">${'<i></i>'.repeat(28)}</div><div class="line"><span>7-day streak</span><b>✓</b></div><button class="orange">Mark today complete</button>`);
const recipe=shell(`<small>THE LUNCH CLUB</small><h2>Cook something<br>worth sharing.</h2><div class="recipe"></div><h3>Chickpea lunch bowl</h3><span class="tag">20 min · Easy</span><div class="line">Save recipe <b>♡</b></div>`);
const recipeDetail=shell(`<small>STEP 01 / 04</small><h2>Keep it simple.</h2><div class="line">1 cup chickpeas <b>✓</b></div><div class="line">½ red onion <b>✓</b></div><div class="line">Fresh herbs <b>○</b></div><div class="card">Chop the onion. Rinse the chickpeas. Add a squeeze of lemon.</div><button class="orange">Start cooking</button>`,'detail');
const notes=shell(`<small>POCKET NOTES</small><h2>Good ideas,<br>kept close.</h2><input placeholder="Find a note" style="width:100%;border:1px solid #e5e9da;border-radius:6px;padding:8px;font-size:7px"><div class="note"><b>Ideas for the weekend</b><br>Sketch a simple reading tracker.<br><small>JUST NOW · SYNCED</small></div><div class="note"><b>Meeting notes</b><br>Keep the first version small.<br><small>YESTERDAY</small></div><div class="note"><b>A useful reminder</b><br>Build one screen at a time.</div>`);
const release=shell(`<small>RELEASE DESK</small><h2>Ready for<br>real phones.</h2><div class="build"><b>Android build</b><span class="check">Ready ✓</span></div><div class="build"><b>iOS build</b><span class="check">Ready ✓</span></div><div class="card"><small>VERSION 1.0.0</small><h3>Your first release.</h3>Check your assets. Test the final build.</div><button class="orange">View release checklist</button>`);
const items=[`<div class="label">DAYLIGHT / REACT NATIVE</div>${planner}<div class="feature">ONE REUSABLE COMPONENT<b>3 different tasks.</b>Props do the heavy lifting.</div><div class="caption"><h1>Your day,<br>on your terms.</h1><p>Components · state · navigation</p></div>`,`${journal}${photoDetail}<div class="caption"><small>EXPO / FIELDNOTES</small><h1>Little moments.<br>Saved.</h1></div>`,`<div class="caption"><small>JAVASCRIPT / STREAK</small><h1>One habit.<br>One function.<br>Every day.</h1></div>${habits}<div class="code">const next = habits.map(h =&gt;<br>　h.id === id<br>　 ? { ...h, done: true }<br>　 : h<br>);</div>`,`<div class="caption"><small>MOBILE UI</small><h1>Made for<br>your thumbs.</h1></div>${recipe}${recipeDetail}`,`${notes}<div class="feature">POCKET NOTES<b>Saved. Synced.</b>Loading and error states included.</div><div class="caption"><h1>Your ideas.<br>Everywhere.</h1><p>API requests · auth · persistence</p></div>`,`${release}<div class="caption"><small>EXPO / RELEASE DESK</small><h1>From your laptop<br>to their phone.</h1></div><div class="feature">RELEASE CHECKLIST<b>Icon, splash screen, build.</b><span class="check">✓ Tested on a real device</span></div>`];
const n=Number(new URLSearchParams(location.search).get('project'))||0;document.getElementById('root').innerHTML=`<main class="artboard art${n}" aria-label="Project ${n+1} original app UI">${items[n]||items[0]}</main>`;
</script></body></html>
